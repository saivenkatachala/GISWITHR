<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="shortcut icon" type="image/png" href="logo.png"/>
<title>Sign In — GIS with R Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d1117;--panel-bg:#161b22;--panel-border:#21262d;--accent:#58a6ff;--accent2:#3fb950;--accent3:#f78166;--accent4:#d2a8ff;--text:#e6edf3;--text-muted:#8b949e;--text-dim:#6e7681;--hover:#1c2128;--header-h:64px;}
:root.light{--bg:#f6f8fa;--panel-bg:#fff;--panel-border:#d0d7de;--accent:#0969da;--accent2:#1a7f37;--accent3:#cf222e;--accent4:#8250df;--text:#24292f;--text-muted:#57606a;--text-dim:#6e7781;--hover:#eaeef2;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* header */
header{height:var(--header-h);background:var(--panel-bg);border-bottom:1px solid var(--panel-border);display:flex;align-items:center;padding:0 32px;gap:16px;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;color:var(--text);}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#1a6fe6,#58a6ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:700;color:#fff;}
.header-badge{background:rgba(88,166,255,0.12);border:1px solid rgba(88,166,255,0.25);color:var(--accent);font-size:0.7rem;padding:2px 10px;border-radius:20px;font-weight:600;letter-spacing:0.04em;}
.theme-btn{margin-left:auto;background:var(--panel-bg);border:1px solid var(--panel-border);color:var(--text-muted);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.75rem;font-family:'Sora',sans-serif;display:flex;align-items:center;gap:6px;transition:all 0.15s;}
.theme-btn:hover{border-color:var(--accent);color:var(--text);}

/* page */
.page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}

/* grid bg */
.page-wrap::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--panel-border) 1px,transparent 1px),linear-gradient(90deg,var(--panel-border) 1px,transparent 1px);background-size:40px 40px;opacity:0.25;pointer-events:none;z-index:0;}

/* card */
.login-card{position:relative;z-index:1;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;padding:40px 40px 36px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4);}
.login-card::before{content:'';position:absolute;top:-1px;left:32px;right:32px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:2px;}

.card-top{text-align:center;margin-bottom:32px;}
.card-logo{width:52px;height:52px;background:linear-gradient(135deg,#1a6fe6,#58a6ff);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:#fff;margin:0 auto 16px;}
.card-title{font-size:1.4rem;font-weight:700;color:var(--text);letter-spacing:-0.02em;margin-bottom:6px;}
.card-sub{font-size:0.8rem;color:var(--text-muted);font-weight:300;}

/* form */
.form-group{margin-bottom:16px;}
label{display:block;font-size:0.74rem;font-weight:600;color:var(--text-muted);margin-bottom:7px;letter-spacing:0.04em;text-transform:uppercase;}

/* input wrapper */
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap .field-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;transition:color 0.15s;z-index:2;display:flex;align-items:center;}
.input-wrap:focus-within .field-icon{color:var(--accent);}

input[type=text],input[type=password]{
  width:100%;background:var(--bg);border:1px solid var(--panel-border);
  border-radius:8px;padding:11px 12px 11px 38px;
  color:var(--text);font-family:'Sora',sans-serif;font-size:0.875rem;
  outline:none;transition:border-color 0.15s,box-shadow 0.15s;
}
/* password field gets extra right padding for the eye button */
input#passwordInput{padding-right:42px;}

input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,0.12);}

/* eye toggle button — sits inside the wrapper, right side */
.pw-toggle{
  position:absolute;right:0;top:0;bottom:0;
  width:40px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;
  color:var(--text-dim);z-index:3;
  border-radius:0 8px 8px 0;
  transition:color .15s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-toggle svg{display:block;flex-shrink:0;}

/* submit */
.login-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:'Sora',sans-serif;font-size:0.875rem;font-weight:600;cursor:pointer;transition:opacity 0.15s,transform 0.1s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.01em;}
.login-btn:hover:not(:disabled){opacity:0.88;transform:translateY(-1px);}
.login-btn:active:not(:disabled){transform:translateY(0);}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* spinner */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}

/* alert */
.alert{display:none;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:8px;font-size:0.8rem;line-height:1.5;margin-top:16px;}
.alert.error{background:rgba(247,129,102,0.1);border:1px solid rgba(247,129,102,0.25);color:var(--accent3);}
.alert.success{background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.25);color:var(--accent2);}
.alert.show{display:flex;}

/* session warning */
.session-warning{background:rgba(88,166,255,0.08);border:1px solid rgba(88,166,255,0.2);color:var(--accent);font-size:0.77rem;padding:10px 14px;border-radius:8px;margin-bottom:20px;display:none;line-height:1.5;}
.session-warning.show{display:block;}

/* footer note */
.login-note{text-align:center;margin-top:20px;font-size:0.72rem;color:var(--text-dim);line-height:1.6;}
.login-note strong{color:var(--text-muted);}

/* footer */
footer{text-align:center;padding:20px 16px;border-top:1px solid var(--panel-border);color:var(--text-dim);font-size:0.78rem;margin-top:auto;}
footer strong{color:var(--text-muted);}
footer a{color:var(--accent);text-decoration:none;}

@media(max-width:480px){.login-card{padding:28px 22px 24px;}.card-title{font-size:1.2rem;}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">R</div>GIS with R</div>
  <span class="header-badge">Study Notes</span>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()"><span id="themeIcon">☀️</span><span id="themeLabel">Light</span></button>
</header>

<div class="page-wrap">
  <div class="login-card">
    <div class="card-top">
      <div class="card-logo">R</div>
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to access GIS with R Study Hub</div>
    </div>

    <div class="session-warning" id="sessionWarning">
      🔒 Access restricted — please sign in to continue.
    </div>

    <div class="form-group">
      <label for="usernameInput">Username</label>
      <div class="input-wrap">
        <span class="field-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="usernameInput" placeholder="Enter your username" autocomplete="username" spellcheck="false"/>
      </div>
    </div>

    <div class="form-group">
      <label for="passwordInput">Password</label>
      <div class="input-wrap">
        <span class="field-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password"/>
        <button class="pw-toggle" type="button" id="pwToggle" title="Show/hide password">
          <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="loginBtnText">Sign In</span>
    </button>

    <div class="alert error" id="errorAlert">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorMsg">Invalid username or password.</span>
    </div>

    <div class="login-note">
      🕐 Sessions expire after <strong>12 hours</strong> .
    </div>
  </div>
</div>

<footer>
  Designed &amp; Developed by <strong>A SAI VENKAT</strong>
  &nbsp;·&nbsp;
  <a href="https://github.com/saivenkatachala" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
// ── CONFIG — replace with your deployed Apps Script URL ──────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyyEj3YdS_u1goBRL12xM56_EY8_I9qtWx44v1Y3CR5joUhGcfLDe50er0URV6USFgcSA/exec';
const SESSION_KEY = 'gis_session';
const SESSION_DURATION_MS = 12 * 60 * 60 * 1000;

// ── THEME ────────────────────────────────────────────────────
function toggleTheme(){
  var l=document.documentElement.classList.toggle('light');
  document.getElementById('themeIcon').textContent=l?'🌙':'☀️';
  document.getElementById('themeLabel').textContent=l?'Dark':'Light';
  try{localStorage.setItem('rTheme',l?'light':'dark');}catch(e){}
}
(function(){
  try{
    if(localStorage.getItem('rTheme')==='light'){
      document.documentElement.classList.add('light');
      document.getElementById('themeIcon').textContent='🌙';
      document.getElementById('themeLabel').textContent='Dark';
    }
  }catch(e){}
})();

// ── PASSWORD TOGGLE ──────────────────────────────────────────
document.getElementById('pwToggle').addEventListener('click', function(){
  var inp = document.getElementById('passwordInput');
  var isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  document.getElementById('eyeIcon').innerHTML = isText
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
});

// ── SESSION CHECK — if already logged in, skip login ─────────
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if(s && s.token && s.expiry && Date.now() < s.expiry){
      var params = new URLSearchParams(window.location.search);
      var redir = params.get('redirect') || 'index.html';
      window.location.href = decodeURIComponent(redir);
    }
  }catch(e){}
  // Show warning if ?redirect= present (means they were blocked)
  var params = new URLSearchParams(window.location.search);
  if(params.get('redirect')){
    document.getElementById('sessionWarning').classList.add('show');
  }
})();

// ── ENTER KEY ────────────────────────────────────────────────
document.getElementById('usernameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('passwordInput').focus(); });
document.getElementById('passwordInput').addEventListener('keydown', function(e){ if(e.key==='Enter') handleLogin(); });

// ── LOGIN HANDLER ────────────────────────────────────────────
async function handleLogin(){
  var username = document.getElementById('usernameInput').value.trim();
  var password = document.getElementById('passwordInput').value;

  // Clear previous errors
  document.getElementById('errorAlert').classList.remove('show');

  if(!username || !password){
    showError('Please enter both username and password.');
    return;
  }

  setLoading(true);

  try {
    var url = APPS_SCRIPT_URL + '?action=login&username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
    var res = await fetch(url);
    var data = await res.json();

    if(data.success){
      // Save session
      var session = {
        username: data.username || username,
        token: data.token,
        expiry: Date.now() + SESSION_DURATION_MS
      };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

      // Redirect
      var params = new URLSearchParams(window.location.search);
      var redir = params.get('redirect') || 'index.html';
      window.location.href = decodeURIComponent(redir);
    } else {
      showError(data.message || 'Invalid username or password.');
    }
  } catch(err) {
    showError('Connection error. Please check your internet and try again.');
  } finally {
    setLoading(false);
  }
}

function showError(msg){
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorAlert').classList.add('show');
}

function setLoading(on){
  var btn = document.getElementById('loginBtn');
  var spinner = document.getElementById('spinner');
  var txt = document.getElementById('loginBtnText');
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  txt.textContent = on ? 'Signing in…' : 'Sign In';
}
</script>
</body>
</html>
